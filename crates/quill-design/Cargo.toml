[package]
name = "quill-design"
version = "0.1.0"
edition = "2021"
description = "Quill's design model: typed design tokens, layouts and presets. No I/O and no web dependencies."
license = "MIT"

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false }
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
insta = "1"
