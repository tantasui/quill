# Example nginx configuration. The dashboard's "Connect your site" page
# generates the same snippet with your actual address filled in.

# --- Option A: a folder on an existing site, e.g. https://example.com/blog ---
# Add this inside the existing `server { … }` block for example.com.
location /blog/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 12m;
}

