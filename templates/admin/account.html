{% extends "admin/base.html" %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Account</h1>
</div>
<form method="post" action="{{ base }}/admin/account" class="card stack form-narrow">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <h2>Change password</h2>
  <input type="text" name="username" value="{{ user.username }}" autocomplete="username" hidden>
  <div class="field">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" required autocomplete="current-password">
  </div>
  <div class="field-row">
    <div class="field">
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" required minlength="{{ min_password }}" autocomplete="new-password" aria-describedby="np_help">
      <p class="help" id="np_help">At least {{ min_password }} characters.</p>
    </div>
    <div class="field">
      <label for="new_password_confirm">Confirm new password</label>
      <input id="new_password_confirm" name="new_password_confirm" type="password" required minlength="{{ min_password }}" autocomplete="new-password">
    </div>
  </div>
  <p class="help">Changing your password signs out every other device.</p>
  <div><button type="submit" class="btn btn-primary">Change password</button></div>
</form>
{% endblock %}
