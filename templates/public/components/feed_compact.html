<ol class="post-rows">
  {% for a in feed_articles %}
  <li class="post-row">
    <time class="post-row-date" datetime="{{ a.date_iso }}">{{ a.date_iso[:10] }}</time>
    <div class="post-row-body">
      <h2 class="post-title"><a href="{{ a.url }}">{{ a.title }}</a></h2>
      {% if a.excerpt %}<p class="post-excerpt">{{ a.excerpt }}</p>{% endif %}
      <p class="post-row-meta"><span>{{ a.reading_minutes }} min</span>{% for t in a.tags %} <a class="tag" href="{{ t.url }}">#{{ t.name }}</a>{% endfor %}</p>
    </div>
  </li>
  {% endfor %}
</ol>
