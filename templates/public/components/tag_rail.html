<aside class="sidebar" aria-label="About this blog">
  {% if site.description %}
  <section class="side-block">
    <h2 class="side-title">about</h2>
    <p>{{ site.description }}</p>
  </section>
  {% endif %}
  {% if nav_tags %}
  <section class="side-block">
    <h2 class="side-title">tags</h2>
    <ul class="tag-list">
      {% for t in nav_tags %}<li><a class="tag" href="{{ t.url }}">{{ t.name }}<span class="tag-count">{{ t.count }}</span></a></li>{% endfor %}
    </ul>
  </section>
  {% endif %}
  <section class="side-block">
    <h2 class="side-title">subscribe</h2>
    <p><a href="{{ feed_url }}">Atom feed</a></p>
  </section>
</aside>
