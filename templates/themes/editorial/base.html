<!doctype html>
<html lang="{{ site.language }}">
<head>
{% include "public/_head.html" %}
{% block head %}{% endblock %}
</head>
<body class="theme-editorial">
{% include "public/_banner.html" %}
<div class="page">
  <header class="site-header">
    <a class="site-title" href="{{ base }}/">{{ site.name }}</a>
    {% if site.description %}<p class="site-tagline">{{ site.description }}</p>{% endif %}
    <nav class="site-nav" aria-label="Main">
      <a href="{{ base }}/">Home</a>
      <a href="{{ base }}/archive">Archive</a>
      <a href="{{ feed_url }}">Feed</a>
    </nav>
  </header>
  <main id="content" class="site-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>{{ site.footer or ("© " ~ year ~ " " ~ site.name) }}</p>
  </footer>
</div>
</body>
</html>
